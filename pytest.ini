[pytest]
testpaths =
    tests
    core/test_portfolio_rebalancer.py
    hacienda/test_tax_tracker.py
    l2_tactic/test_grok_models.py
    l2_tactic/test_tight_range_handler.py
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_default_fixture_loop_scope = function
addopts = -ra --strict-markers
markers =
    unit: pruebas unitarias sin servicios externos
    integration: pruebas de integración aisladas
    contract: pruebas de contratos entre componentes
    regression: pruebas de regresión de defectos conocidos
