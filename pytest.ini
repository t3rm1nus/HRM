[pytest]
testpaths = tests_nuevos
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    unit: pruebas unitarias sin servicios externos
    integration: pruebas de integración aisladas
    contract: pruebas de contratos entre componentes
    regression: pruebas de regresión de defectos conocidos
